<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>纸样 · 数字表演时序试验</title>
<style>
  :root{color-scheme:light dark;font-family:system-ui,"Microsoft YaHei",sans-serif;color:light-dark(#283236,#eeeae1);background:light-dark(#f5f3ed,#22262a)}
  body{max-width:1000px;margin:auto;padding:24px} h1{font-size:22px;font-weight:500;margin:0 0 12px} p{line-height:1.6}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
  button{font:inherit;padding:8px 16px;border:1px solid light-dark(#acb4b4,#798289);border-radius:6px;background:transparent;color:inherit}
  button[aria-pressed=true]{background:light-dark(#354f58,#d5e5e7);color:light-dark(#fff,#17262a)}
  canvas{width:100%;height:auto;display:block;background:#f4f1e9;border-radius:4px}
  input[type=range]{width:100%} label{display:flex;align-items:center;gap:8px} output{font-variant-numeric:tabular-nums}
  .note{font-size:14px;opacity:.8} #diagnostic{white-space:pre-wrap;line-height:1.6;font-size:14px}
</style>
<h1>纸样 · 数字表演时序试验</h1>
<div class="controls" aria-label="选择版本">
  <button type="button" data-variant="X" aria-pressed="true">X</button>
  <button type="button" data-variant="Y" aria-pressed="false">Y</button>
  <button type="button" data-variant="Z" aria-pressed="false">Y′</button>
  <button type="button" id="play">播放</button>
  <output id="time">0.00 / 10.00 s</output>
</div>
<canvas id="stage" width="900" height="520" role="img" aria-label="两名中性角色在桌边伸手与收手；可选择版本、拖动时间，并打开审查层。">浏览器需要支持Canvas。</canvas>
<label for="scrub" class="note">时刻</label>
<input id="scrub" aria-label="预演时刻（秒）" type="range" min="0" max="10" value="0" step="0.01">
<div class="controls"><label><input id="review" type="checkbox">显示审查层</label></div>
<div id="diagnostic" hidden></div>
<p class="note">原创新增的动作简图，默认无解释箭头、对白或音乐。它用于检查空间、接触和时序；角色造型与美术风格尚未定稿。</p>
<script>
(() => {
  const variants={X:{withdraw:3,door:false},Y:{withdraw:4.7,door:false},Z:{withdraw:4.7,door:true}};
  const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d');
  const slider=document.getElementById('scrub'),play=document.getElementById('play');
  const review=document.getElementById('review'),diagnostic=document.getElementById('diagnostic');
  let key='X',t=0,running=false,last=null;
  const phase=(v,a,b)=>{const u=Math.max(0,Math.min(1,(v-a)/(b-a)));return u*u*(3-2*u)};
  const mix=(a,b,u)=>[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];
  function frame(){
    const v=variants[key],reach=phase(t,.5,2),withdraw=phase(t,v.withdraw,v.withdraw+1.3);
    const mh=mix([633,340],[535,278],reach*(1-withdraw)),ch=mix([303,346],[473,284],phase(t,3,4));
    return {t,variant:key,chen_hand:ch,meng_hand:mh,chen_gaze:t>1.4&&t<6.3?mh:[401,282],meng_gaze:v.door?[830,200]:t<4?[470,282]:[310,177],paper:[443,273,97,25]};
  }
  function path(points,fill,stroke='#363d42',width=1,close=false){
    ctx.beginPath();ctx.moveTo(...points[0]);points.slice(1).forEach(p=>ctx.lineTo(...p));if(close)ctx.closePath();
    if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke()}
  }
  function ellipse(x,y,rx,ry,fill,stroke='#363d42',width=1){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}
  function rect(x,y,w,h,fill,stroke=null,r=0){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
  function elbow(shoulder,hand,len,side){const dx=hand[0]-shoulder[0],dy=hand[1]-shoulder[1],d=Math.max(.001,Math.hypot(dx,dy)),h=Math.sqrt(Math.max(0,len*len-d*d/4));return [shoulder[0]+dx/2-side*dy/d*h,shoulder[1]+dy/2+side*dx/d*h]}
  function person(x,color,hand,other,gaze,name){
    const bend=name==='陈'?1:-1,active=[x+(name==='陈'?20:-20),250],free=[x+(name==='陈'?-20:20),250];
    path([[x-15,355],[x-28,430]],null,color,14);path([[x+15,355],[x+27,430]],null,color,14);
    path([[x-35,430],[x-7,430]],null,'#363d42',5);path([[x+17,430],[x+42,430]],null,'#363d42',5);
    rect(x-30,239,60,120,color,null,18);path([[x,225],[x,244]],null,color,17);
    ellipse(x,186,34,40,'#dfc8a6','#363d42',2);
    for(const ex of [x-13,x+13]){ellipse(ex,184,9,7,'#fffdf7');const dx=gaze[0]-x,dy=gaze[1]-184,d=Math.max(1,Math.hypot(dx,dy));ellipse(ex+5*dx/d,184+3*dy/d,3,3,'#363d42',null)}
    path([[x-8,210],[x+8,210]],null,'#363d42',2);
    path([free,elbow(free,other,80,bend),other],null,color,13);
    if(name==='孟')for(const shift of [6,3,0])path([[other[0]-17,other[1]-17+shift],[other[0]+28,other[1]-17+shift],[other[0]+33,other[1]+6+shift],[other[0]-12,other[1]+6+shift]],'#f2e9d2','#363d42',1,true);
    ellipse(other[0],other[1],9,7,'#dfc8a6');
    path([active,elbow(active,hand,90,bend),hand],null,color,13);
    const [hx,hy]=hand;
    if(name==='陈'){
      rect(hx-20,hy-9,38,18,'#dfc8a6','#363d42',4);
      for(const off of [-12,-5,2,9])path([[hx+off,hy-7],[hx+off,hy-1]],null,'#9b866a',1);
    }else{
      path([[hx+18,hy+8],[hx-10,hy+7],[hx-13,hy+2],[hx-7,hy-3],[hx+9,hy-3],[hx+14,hy-11],[hx+19,hy-9]],'#dfc8a6','#363d42',1,true);
      path([[hx-9,hy+2],[hx+9,hy+2]],null,'#363d42',2);
    }
    ctx.font='19px "Microsoft YaHei",sans-serif';ctx.fillStyle='#f6f0e5';ctx.fillText(name,x-9,288);
    if(review.checked){path([[x,184],gaze],null,color,1.5);ellipse(...gaze,4,4,'#f4f1e9',color)}
  }
  function draw(){
    const s=frame();ctx.fillStyle='#f4f1e9';ctx.fillRect(0,0,900,520);
    path([[50,434],[850,434]],null,'#c6c5bd',2);ctx.strokeStyle='#babbb5';ctx.lineWidth=2;ctx.strokeRect(780,100,68,334);ellipse(792,266,3,3,'#aaa99f',null);
    path([[350,300],[569,300],[600,316],[330,316]],'#bcb7a9','#363d42',1,true);
    path([[350,316],[350,434]],null,'#363d42',8);path([[578,316],[578,434]],null,'#363d42',8);
    rect(365,284,66,7,'#6d7c73');path([[373,287],[427,287]],null,'#e4e5d7',1);
    path([[443,273],[537,273],[540,298],[447,298]],'#ece3c6','#363d42',1,true);
    ctx.beginPath();ctx.ellipse(482,288,27,12,0,Math.PI,Math.PI*1.9);ctx.strokeStyle='#9b8a69';ctx.stroke();
    person(309,'#486674',s.chen_hand,[394,287],s.chen_gaze,'陈');person(650,'#916548',s.meng_hand,[691,349],s.meng_gaze,'孟');
    document.getElementById('time').textContent=`${t.toFixed(2)} / 10.00 s`;slider.value=t;
    diagnostic.hidden=!review.checked;
    diagnostic.textContent=`${key==='Z'?'Y′':key}｜撤手起动 ${variants[key].withdraw.toFixed(1)} s｜压纸动作 3.0—4.0 s\n陈手 ${s.chen_hand.map(x=>x.toFixed(1)).join(', ')}｜孟手 ${s.meng_hand.map(x=>x.toFixed(1)).join(', ')}\n纸样固定；这是事件设定，非情绪或观众效果结论。`;
  }
  function tick(now){if(!running)return;if(last!==null)t=Math.min(10,t+(now-last)/1000);last=now;draw();if(t>=10){running=false;last=null;play.textContent='播放';return}requestAnimationFrame(tick)}
  play.onclick=()=>{running=!running;last=null;if(running&&t>=10)t=0;play.textContent=running?'暂停':'播放';if(running)requestAnimationFrame(tick)};
  slider.oninput=()=>{running=false;last=null;play.textContent='播放';t=Number(slider.value);draw()};
  review.onchange=draw;
  document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{key=b.dataset.variant;document.querySelectorAll('[data-variant]').forEach(n=>n.setAttribute('aria-pressed',String(n===b)));draw()});
  window.previsState=()=>frame();
  draw();
})();
</script>
</html>
